<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>xeval - HtmlEngine</title>

  <body>
    <main id="app"></main>
    <script type="module">
      import xeval from "../../dist/xeval.esm.js";

        context: { user: "Alice" }
